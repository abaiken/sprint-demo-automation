[project]
name = "sprint-demo-automation"
version = "0.1.0"
description = "Local Python tooling for sprint demo ceremony coordination"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "slack-sdk>=3.27.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
sprint-demo = "sprint_demo_automation.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
